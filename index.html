<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>処遇改善分配</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f7fa;color:#222}header{background:#1f4e78;color:white;padding:16px;font-size:21px;font-weight:700;position:sticky;top:0}.wrap{padding:12px;max-width:900px;margin:auto}.card{background:white;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 5px #0002}input{box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:8px;font-size:16px;width:100%}.money{font-size:18px}.grid{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{border:1px solid #ddd;padding:6px;text-align:center}th{background:#5b9bd5;color:white}td input{padding:7px;text-align:center}.out{background:#e2f0d9;font-weight:600}.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:20px;font-weight:700}.hint{font-size:13px;color:#555}button{border:0;border-radius:9px;padding:10px 14px;font-size:15px;margin-top:10px}.add{background:#1f4e78;color:white}.reset{background:#ddd;margin-left:6px}@media(max-width:600px){.sum{grid-template-columns:1fr}.wrap{padding:8px}}</style></head><body><header>処遇改善加算 分配計算</header><div class="wrap"><div class="card"><b>対象期間：6月〜11月</b><p>半年間の処遇改善加算金総額</p><input id="total" class="money" type="number" min="0" placeholder="例：1200000" oninput="calc()"></div><div class="card grid"><table><thead><tr><th>担当者</th><th>6月</th><th>7月</th><th>8月</th><th>9月</th><th>10月</th><th>11月</th><th>延べ人数</th><th>比率</th><th>分配金</th></tr></thead><tbody id="rows"></tbody></table><button class="add" onclick="addRow()">＋担当者追加</button><button class="reset" onclick="resetAll()">リセット</button></div><div class="card sum"><div>全職員 延べ人数<div id="allPeople" class="big">0人</div></div><div>分配金 合計<div id="allMoney" class="big">0円</div></div></div><div class="card hint">担当者名と各月の担当利用者数を入力すると、半年延べ人数・比率・分配金を自動計算します。端数は最後に人数が入力されている担当者で調整し、総額と一致させます。入力内容はこの端末内に自動保存されます。</div></div><script>const months=6;function addRow(name=''){const tr=document.createElement('tr');tr.innerHTML=`<td><input class="name" placeholder="氏名" value="${name}"></td>${Array(months).fill('<td><input class="n" type="number" min="0" value="0"></td>').join('')}<td class="out ext">0</td><td class="out rate">0.00%</td><td class="out pay">0円</td>`;document.querySelector('#rows').appendChild(tr);tr.querySelectorAll('input').forEach(x=>x.addEventListener('input',()=>{calc();save()}));calc()}function calc(){let trs=[...document.querySelectorAll('#rows tr')], exts=trs.map(tr=>[...tr.querySelectorAll('.n')].reduce((a,x)=>a+(+x.value||0),0)),all=exts.reduce((a,b)=>a+b,0),total=+document.querySelector('#total').value||0,last=-1;exts.forEach((x,i)=>{if(x>0)last=i});let used=0;trs.forEach((tr,i)=>{let rate=all?exts[i]/all:0,pay=0;if(i===last)pay=Math.max(0,total-used);else if(exts[i]>0){pay=Math.floor(total*rate);used+=pay}tr.querySelector('.ext').textContent=exts[i];tr.querySelector('.rate').textContent=(rate*100).toFixed(2)+'%';tr.querySelector('.pay').textContent=pay.toLocaleString()+'円'});document.querySelector('#allPeople').textContent=all.toLocaleString()+'人';document.querySelector('#allMoney').textContent=total.toLocaleString()+'円';save()}function save(){let data={total:document.querySelector('#total').value,rows:[...document.querySelectorAll('#rows tr')].map(tr=>({name:tr.querySelector('.name').value,nums:[...tr.querySelectorAll('.n')].map(x=>x.value)}))};localStorage.setItem('shoguDist',JSON.stringify(data))}function load(){let d;try{d=JSON.parse(localStorage.getItem('shoguDist'))}catch(e){}if(d){document.querySelector('#total').value=d.total||'';(d.rows||[]).forEach(r=>{addRow(r.name);let tr=document.querySelector('#rows tr:last-child');[...tr.querySelectorAll('.n')].forEach((x,i)=>x.value=r.nums[i]||0)})}else for(let i=0;i<8;i++)addRow();calc()}function resetAll(){if(confirm('入力内容をすべて消しますか？')){localStorage.removeItem('shoguDist');location.reload()}}document.querySelector('#total').addEventListener('input',save);load();</script></body></html>
