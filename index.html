<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b57">
<title>処遇改善分配</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--g:#176b57;--g2:#e9f5f1;--b:#27658f;--bg:#f3f6f8;--line:#d7dfe3}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;margin:0;background:var(--bg);color:#1d2529}
header{background:var(--g);color:#fff;padding:16px;font-size:21px;font-weight:800;position:sticky;top:0;z-index:5}
.wrap{padding:12px;max-width:980px;margin:auto}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px}
.tab{padding:11px 6px;border:0;border-radius:10px;background:#dfe6e9;font-weight:700;font-size:14px}.tab.active{background:var(--g);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px;box-shadow:0 1px 5px #0001}
.serviceTitle{font-size:19px;font-weight:800;margin-bottom:4px}.period{color:#526066;font-size:14px;margin-bottom:12px}
label{display:block;font-weight:700;margin:8px 0 6px}input{width:100%;padding:10px;border:1px solid #b9c2c7;border-radius:8px;font-size:16px}
.grid{overflow:auto}table{border-collapse:collapse;width:100%;min-width:780px}th,td{border:1px solid #d7dfe3;padding:6px;text-align:center}th{background:var(--g);color:#fff}
td input{padding:7px;text-align:center}.out{background:#e8f4ed;font-weight:700}.actions{display:flex;gap:7px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:10px 14px;font-size:15px;font-weight:700}.add{background:#fff;border:1px solid var(--line)}.reset{background:#fff;border:1px solid #e4e8ea}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:21px;font-weight:800}.hint{font-size:13px;color:#536168;line-height:1.6}
.overview table{min-width:0}.overview th{background:var(--g)}.overview td{font-weight:700}.hidden{display:none}
@media(max-width:650px){.wrap{padding:8px}.tabs{grid-template-columns:1fr 1fr}.tabs .tab:last-child{grid-column:1/3}.sum{grid-template-columns:1fr}}
@media print{
 body{background:#fff} header{position:static} .tabs,.actions,.noPrint{display:none!important}
 .wrap{max-width:none;padding:0}.card{box-shadow:none;border:0;padding:6px}.grid{overflow:visible}
 table{min-width:0;font-size:10pt} input{border:0;padding:2px;background:transparent}
}
</style>
</head>
<body>
<header>処遇改善加算 分配計算</header>
<div class="wrap">
  <div class="tabs">
    <button id="tabKyotaku" class="tab active" onclick="switchView('kyotaku')">居宅介護支援</button>
    <button id="tabKeikaku" class="tab" onclick="switchView('keikaku')">計画相談支援</button>
    <button id="tabAll" class="tab" onclick="switchView('all')">全体集計</button>
  </div>
  <div id="workView">
    <div class="card">
      <div id="serviceTitle" class="serviceTitle"></div>
      <div class="period">対象期間：6月～11月（6か月）</div>
      <label>半年間の処遇改善加算金総額（円）</label>
      <input id="total" type="number" min="0" inputmode="numeric" placeholder="例：1200000" oninput="readCalcSave()">
    </div>
    <div class="card grid">
      <table>
        <thead><tr><th>担当者</th><th>6月</th><th>7月</th><th>8月</th><th>9月</th><th>10月</th><th>11月</th><th>延べ人数</th><th>比率</th><th>分配金</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="card actions noPrint">
      <button class="add" onclick="manualSave()">💾 保存</button>
      <button class="add" onclick="window.print()">🖨️ 印刷 / PDF</button>
      <button class="add" onclick="shareResult()">📤 共有</button>
      <button class="add" onclick="addRow()">＋担当者追加</button>
      <button class="reset" onclick="resetCurrent()">この区分をリセット</button>
    </div>
    <div class="card sum">
      <div><div class="hint">全職員 延べ人数</div><div id="sumExt" class="big">0人</div></div>
      <div><div class="hint">分配金 合計</div><div id="sumMoney" class="big">0円</div></div>
    </div>
    <div class="card hint">担当者名と6月～11月の担当利用者数を入力すると、半年延べ人数・比率・分配金を自動計算します。居宅介護支援と計画相談支援は別々に保存されます。端数は最後に人数が入力されている担当者で調整し、各区分の総額と一致させます。</div>
  </div>
  <div id="allView" class="hidden"></div>
</div>
<script>
const months=['6月','7月','8月','9月','10月','11月'];
const defs={
 kyotaku:{title:'居宅介護支援',key:'shoguDistKyotaku'},
 keikaku:{title:'計画相談支援',key:'shoguDistKeikaku'}
};
let current='kyotaku';

function blank(){return {total:'',rows:Array.from({length:8},()=>({name:'',nums:Array(6).fill('0')}))}}
function getData(k){try{return JSON.parse(localStorage.getItem(defs[k].key))||blank()}catch(e){return blank()}}
function saveData(k,d){localStorage.setItem(defs[k].key,JSON.stringify(d))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function switchView(v){
 current=v;
 ['Kyotaku','Keikaku','All'].forEach(x=>document.getElementById('tab'+x).classList.remove('active'));
 document.getElementById(v==='kyotaku'?'tabKyotaku':v==='keikaku'?'tabKeikaku':'tabAll').classList.add('active');
 if(v==='all'){
   document.getElementById('workView').classList.add('hidden');
   document.getElementById('allView').classList.remove('hidden');
   renderAll(); return;
 }
 document.getElementById('allView').classList.add('hidden');
 document.getElementById('workView').classList.remove('hidden');
 render();
}
function rowHtml(r){
 return `<tr><td><input class="name" placeholder="氏名" value="${esc(r.name)}" oninput="readCalcSave()"></td>`+
 r.nums.map((n,i)=>`<td><input class="n" type="number" min="0" inputmode="numeric" value="${esc(n)}" oninput="readCalcSave()"></td>`).join('')+
 `<td class="ext out">0</td><td class="ratio out">0.00%</td><td class="money out">0円</td></tr>`;
}
function render(){
 const d=getData(current);
 document.getElementById('serviceTitle').textContent=defs[current].title;
 document.getElementById('total').value=d.total;
 document.getElementById('rows').innerHTML=d.rows.map(rowHtml).join('');
 calc();
}
function readData(){
 return {
   total:document.getElementById('total').value,
   rows:[...document.querySelectorAll('#rows tr')].map(tr=>({
     name:tr.querySelector('.name').value,
     nums:[...tr.querySelectorAll('.n')].map(x=>x.value)
   }))
 };
}
function readCalcSave(){const d=readData();saveData(current,d);calc()}
function calc(){
 const trs=[...document.querySelectorAll('#rows tr')];
 const exts=trs.map(tr=>[...tr.querySelectorAll('.n')].reduce((a,x)=>a+(+x.value||0),0));
 const all=exts.reduce((a,b)=>a+b,0);
 const total=+document.getElementById('total').value||0;
 let amounts=exts.map(x=>all?Math.floor(total*x/all):0);
 let diff=total-amounts.reduce((a,b)=>a+b,0);
 let last=-1; exts.forEach((x,i)=>{if(x>0)last=i}); if(last>=0)amounts[last]+=diff;
 trs.forEach((tr,i)=>{
   tr.querySelector('.ext').textContent=exts[i];
   tr.querySelector('.ratio').textContent=(all?exts[i]/all*100:0).toFixed(2)+'%';
   tr.querySelector('.money').textContent=amounts[i].toLocaleString()+'円';
 });
 document.getElementById('sumExt').textContent=all.toLocaleString()+'人';
 document.getElementById('sumMoney').textContent=(all?total:0).toLocaleString()+'円';
}
function addRow(){let d=readData();d.rows.push({name:'',nums:Array(6).fill('0')});saveData(current,d);render()}
function resetCurrent(){if(confirm(defs[current].title+'の入力内容をすべて消しますか？')){localStorage.removeItem(defs[current].key);render()}}
function stats(k){
 const d=getData(k), ext=d.rows.reduce((s,r)=>s+(r.nums||[]).reduce((a,x)=>a+(+x||0),0),0);
 return {total:+d.total||0,ext};
}
function renderAll(){
 const a=stats('kyotaku'),b=stats('keikaku'),t=a.total+b.total,e=a.ext+b.ext;
 document.getElementById('allView').innerHTML=`
 <div class="card overview"><div class="serviceTitle">全体集計</div><div class="period">居宅介護支援＋計画相談支援</div>
 <table><thead><tr><th>区分</th><th>加算金総額</th><th>延べ人数</th></tr></thead><tbody>
 <tr><td>居宅介護支援</td><td>${a.total.toLocaleString()}円</td><td>${a.ext.toLocaleString()}人</td></tr>
 <tr><td>計画相談支援</td><td>${b.total.toLocaleString()}円</td><td>${b.ext.toLocaleString()}人</td></tr>
 <tr class="out"><td>会社全体</td><td>${t.toLocaleString()}円</td><td>${e.toLocaleString()}人</td></tr>
 </tbody></table></div>`;
}

function manualSave(){
 if(current==='all'){alert('居宅介護支援・計画相談支援はそれぞれ自動保存されています。');return}
 const d=readData(); saveData(current,d);
 alert(defs[current].title+'の入力内容を保存しました。');
}
function resultText(k){
 const d=getData(k);
 const exts=d.rows.map(r=>(r.nums||[]).reduce((a,x)=>a+(+x||0),0));
 const all=exts.reduce((a,b)=>a+b,0), total=+d.total||0;
 let amounts=exts.map(x=>all?Math.floor(total*x/all):0);
 let diff=total-amounts.reduce((a,b)=>a+b,0), last=-1;
 exts.forEach((x,i)=>{if(x>0)last=i}); if(last>=0) amounts[last]+=diff;
 let lines=[`【${defs[k].title}】`,`対象期間：6月～11月`,`処遇改善加算金総額：${total.toLocaleString()}円`,`延べ人数合計：${all.toLocaleString()}人`,''];
 d.rows.forEach((r,i)=>{
   if((r.name||'').trim() || exts[i]>0){
     const ratio=all?exts[i]/all*100:0;
     lines.push(`${r.name||'（氏名未入力）'}：延べ${exts[i]}人／${ratio.toFixed(2)}%／${amounts[i].toLocaleString()}円`);
   }
 });
 lines.push('',`分配金合計：${(all?total:0).toLocaleString()}円`);
 return lines.join('\n');
}
async function shareResult(){
 let textToShare;
 if(current==='all'){
   const a=stats('kyotaku'),b=stats('keikaku');
   textToShare=`【処遇改善分配 全体集計】\n対象期間：6月～11月\n居宅介護支援：${a.total.toLocaleString()}円／延べ${a.ext.toLocaleString()}人\n計画相談支援：${b.total.toLocaleString()}円／延べ${b.ext.toLocaleString()}人\n会社全体：${(a.total+b.total).toLocaleString()}円／延べ${(a.ext+b.ext).toLocaleString()}人`;
 } else {
   saveData(current,readData());
   textToShare=resultText(current);
 }
 try{
   if(navigator.share){
     await navigator.share({title:'処遇改善分配',text:textToShare});
   }else if(navigator.clipboard){
     await navigator.clipboard.writeText(textToShare);
     alert('共有用の計算結果をコピーしました。LINEやメールに貼り付けてください。');
   }else{
     prompt('共有用の計算結果をコピーしてください。',textToShare);
   }
 }catch(e){}
}
render();
</script>
</body></html>
